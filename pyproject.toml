[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "social-poster"
version = "0.1.0"
description = "Automated Social Media Posting — schedule and publish content across platforms"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "social-poster contributors" }]
keywords = ["social-media", "automation", "scheduler", "twitter", "mastodon"]
dependencies = []

[project.optional-dependencies]
# Needed only to actually publish to live networks.
http = ["requests>=2.25"]
yaml = ["pyyaml>=5.4"]
dev = ["pytest>=7.0", "requests>=2.25", "pyyaml>=5.4"]

[project.scripts]
social-poster = "social_poster.cli:main"

[project.urls]
Homepage = "https://github.com/deluxw4gfd/first-project"

[tool.setuptools.packages.find]
include = ["social_poster*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
